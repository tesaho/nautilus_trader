[package]
name = "nautilus-lys2"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Lys adapter for NautilusTrader"
documentation.workspace = true

[lib]
name = "nautilus_lys2"
crate-type = ["rlib", "cdylib"]

[dependencies]
nautilus-common = { workspace = true }
nautilus-core = { workspace = true }
nautilus-cryptography = { workspace = true }
nautilus-model = { workspace = true }
nautilus-network = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
derive_builder = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

# ZeroMQ for Lys Flash SDK
tmq = "0.4"
rmp-serde = "1.3"  # MessagePack serialization

# Solana dependencies for wallet management
solana-sdk = "1.18"
bs58 = "0.5"

[dev-dependencies]
rstest = { workspace = true }
tokio-test = "0.4"

[features]
default = []
python = ["pyo3", "pyo3-async-runtimes", "nautilus-core/python", "nautilus-model/python"]
extension-module = ["python", "pyo3/extension-module"]
